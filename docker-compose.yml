# Full stack for local runs and the Playwright E2E in CI:
#   docker compose up --build    -> web http://localhost:8080, API http://localhost:8000,
#                                   inbox http://localhost:8025
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: swap
      POSTGRES_PASSWORD: swap-local-only
      POSTGRES_DB: swap
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U swap"]
      interval: 2s
      retries: 30

  mailpit:
    # Local inbox for verification and reset mails
    image: axllent/mailpit:v1.27
    ports:
      - "1025:1025"
      - "8025:8025"

  api:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      SWAP_DATABASE_URL: postgresql+psycopg://swap:swap-local-only@db:5432/swap
      SWAP_JWT_SECRET: local-compose-secret-not-for-production-use
      SWAP_SMTP_HOST: mailpit
      SWAP_APP_URL: http://localhost:8080
      SWAP_CORS_ORIGINS: http://localhost:8080
      SWAP_SEED_DEMO: "true"
      # E2E runs register and sign in many times from one address; keep the limiter on
      # but out of the way (its own tests live in backend/tests/test_ratelimit.py).
      SWAP_RATE_LIMIT_LOGIN: 200/minute
      SWAP_RATE_LIMIT_REGISTER: 200/minute
      SWAP_RATE_LIMIT_FORGOT: 200/minute
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 2s
      retries: 30

  web:
    build:
      context: ./project
      args:
        VITE_API_URL: http://localhost:8000
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "8080:8080"
