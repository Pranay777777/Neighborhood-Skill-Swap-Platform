# Render Blueprint - free plan, no card. Database: Neon free Postgres (Render's free
# Postgres expires after 30 days). Values marked sync: false are typed into the Render
# dashboard by the account owner; the JWT secret is generated by Render and never seen.
services:
  - type: web
    name: skillswap-api
    runtime: docker
    plan: free
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: SWAP_DATABASE_URL
        sync: false # Neon connection string
      - key: SWAP_JWT_SECRET
        generateValue: true
      - key: SWAP_APP_URL
        sync: false # the static site's URL, e.g. https://skillswap-web.onrender.com
      - key: SWAP_CORS_ORIGINS
        sync: false # same URL as SWAP_APP_URL
      - key: SWAP_MAIL_BACKEND
        value: console # no free outbound mail; demo accounts are pre-verified
      - key: SWAP_SEED_DEMO
        value: "true"

  - type: web
    name: skillswap-web
    runtime: static
    rootDir: project
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        sync: false # the API's URL, e.g. https://skillswap-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
